services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskuser}:${POSTGRES_PASSWORD:-local_demo_password}@db:5432/${POSTGRES_DB:-tasks}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: tasks_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tasks_test"]
      interval: 2s
      timeout: 5s
      retries: 15
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/tasks_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/tasks_test
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres_data:
